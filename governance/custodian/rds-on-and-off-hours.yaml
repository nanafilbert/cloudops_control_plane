# NOTE: RDS off-hours is handled by .github/workflows/07-rds-schedule.yml
# using native AWS CLI calls. This file documents the policy intent only.
# Cloud Custodian Lambda mode would be required for true event-driven execution.

policies:
  - name: rds-stop-off-hours
    resource: rds
    description: Stop RDS during off-hours to save cost
    filters:
      - type: value
        key: DBInstanceIdentifier
        value: cloudops-dev-postgres-db
      - type: offhour
        offhour: 22       # stop at 10pm UTC
        onhour: 8          # start at 8am UTC
        default_tz: utc
    actions:
      - stop

  - name: rds-start-on-hours
    resource: rds
    filters:
      - type: value
        key: DBInstanceIdentifier
        value: cloudops-dev-postgres-db
      - type: onhour
        offhour: 22
        onhour: 8
        default_tz: utc
    actions:
      - start