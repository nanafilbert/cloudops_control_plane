policies:
  - name: unused-nlb-cleanup
    resource: app-elb
    description: Remove NLBs with no registered targets
    filters:
      - type: value
        key: Type
        value: network
      - type: metrics
        name: ActiveFlowCount
        statistics: Sum
        days: 7
        value: 0
        op: eq
    actions:
      - type: delete