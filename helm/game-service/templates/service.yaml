apiVersion: v1
kind: Service
metadata:
  name: {{ include "game-service.fullname" . }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-name: "cloudops-dev-game-service-lb"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app: {{ .Chart.Name }}