name: "Destroy Environment"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DESTROY" to confirm deletion of all resources'
        required: true
        default: ''
      environment:
        description: 'Environment to destroy (dev/prod)'
        required: true
        default: 'dev'

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'
    env:
      TF_WORKING_DIR: 'terraform/environments/${{ github.event.inputs.environment }}'
      CLUSTER_NAME: cloudops-dev-eks-cluster
      REGION: us-east-1
      ECR_REPO: cloudops-dev-game-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      # ── Step 1: Update kubeconfig ─────────────────────────────
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.REGION }}
        continue-on-error: true

      # ── Step 2: Uninstall all Helm releases ───────────────────
      - name: Uninstall Helm releases
        run: |
          helm uninstall game-service      --namespace game-dev          2>/dev/null || true
          helm uninstall monitoring        --namespace monitoring         2>/dev/null || true
          helm uninstall loki              --namespace logging            2>/dev/null || true
          helm uninstall external-secrets  --namespace external-secrets  2>/dev/null || true
          helm uninstall metrics-server    --namespace kube-system       2>/dev/null || true
        continue-on-error: true

      # ── Step 3: Remove finalizers and delete namespaces ───────
      - name: Delete namespaces
        run: |

          for ns in game-dev monitoring logging external-secrets; do
            kubectl get externalsecret -n $ns -o name 2>/dev/null | \
              xargs -I {} kubectl patch {} -n $ns \
                --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true

           
            kubectl get pvc -n $ns -o name 2>/dev/null | \
              xargs -I {} kubectl patch {} -n $ns \
                --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
          done

         
          kubectl delete namespace game-dev        --ignore-not-found --timeout=60s || true
          kubectl delete namespace monitoring       --ignore-not-found --timeout=60s || true
          kubectl delete namespace logging          --ignore-not-found --timeout=60s || true
          kubectl delete namespace external-secrets --ignore-not-found --timeout=60s || true

          
          for ns in game-dev monitoring logging external-secrets; do
            STATUS=$(kubectl get namespace $ns \
              -o jsonpath='{.status.phase}' 2>/dev/null || echo "gone")
            if [ "$STATUS" = "Terminating" ]; then
              echo "Force-removing finalizers from namespace $ns"
              kubectl get namespace $ns -o json | \
                python3 -c "
                import json, sys
                ns = json.load(sys.stdin)
                ns['spec']['finalizers'] = []
                print(json.dumps(ns))
                " | kubectl replace --raw "/api/v1/namespaces/$ns/finalize" -f - || true
            fi
          done

          echo "Waiting 60s for NLBs and security groups to be deprovisioned..."
          sleep 60
        continue-on-error: true

      # ── Step 4: Delete cluster-wide resources ─────────────────
      - name: Delete cluster-wide resources
        run: |
          kubectl delete clustersecretstore --all    2>/dev/null || true
          kubectl delete clusterexternalsecret --all 2>/dev/null || true
        continue-on-error: true

      # ── Step 5: Delete ECR images ─────────────────────────────
      - name: Delete ECR images
        run: |
          echo "Fetching image digests..."
          DIGESTS=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO }} \
            --region ${{ env.REGION }} \
            --query 'imageDetails[*].imageDigest' \
            --output text 2>/dev/null || echo "")

          if [ -z "$DIGESTS" ]; then
            echo "No images found in ECR"
          else
            for digest in $DIGESTS; do
              echo "Deleting image: $digest"
              aws ecr batch-delete-image \
                --repository-name ${{ env.ECR_REPO }} \
                --region ${{ env.REGION }} \
                --image-ids imageDigest=$digest || true
            done
            echo "ECR images deleted"
          fi
        continue-on-error: true

      # ── Step 6: Force delete Secrets Manager secrets ──────────
      - name: Force delete secrets
        run: |
          for secret in \
            cloudops-dev-postgres-secret \
            cloudops-dev-redis-secret; do
            echo "Deleting secret: $secret"
            aws secretsmanager delete-secret \
              --secret-id $secret \
              --force-delete-without-recovery \
              --region ${{ env.REGION }} 2>/dev/null || true
          done
        continue-on-error: true

      # ── Step 7: Terraform destroy ─────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Destroy
        env:
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_admin_iam_principal_arn: ${{ secrets.ADMIN_IAM_PRINCIPAL_ARN }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_GH_OIDC_ROLE_ARN: ${{ secrets.GH_OIDC_ROLE_ARN }}
        run: terraform destroy -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Step 8: Verify nothing left behind ────────────────────
      - name: Verify cleanup
        if: always()
        run: |
          echo "=== Remaining ECR images ==="
          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPO }} \
            --region ${{ env.REGION }} 2>/dev/null || echo "Repo gone or empty"

          echo "=== Remaining secrets ==="
          aws secretsmanager list-secrets \
            --region ${{ env.REGION }} \
            --query 'SecretList[?contains(Name, `cloudops`)].Name' \
            --output table 2>/dev/null || echo "None"

          echo "=== Remaining EKS clusters ==="
          aws eks list-clusters \
            --region ${{ env.REGION }} \
            --query 'clusters' \
            --output table 2>/dev/null || echo "None"

          echo "=== Remaining VPCs ==="
          aws ec2 describe-vpcs \
            --region ${{ env.REGION }} \
            --filters "Name=tag:Project,Values=cloudops-control-plane" \
            --query 'Vpcs[*].{ID:VpcId,Name:Tags[?Key==`Name`]|[0].Value}' \
            --output table 2>/dev/null || echo "None"
        continue-on-error: true