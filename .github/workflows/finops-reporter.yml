name: "FinOps Reporter"

on:
  schedule:
    - cron: '0 8 1 * *'    # 1st of every month at 8am UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 python-dateutil c7n

      # ── Cost Report ───────────────────────────────────────────
      - name: Run cost report
        run: python3 finops/automation/automation-cost-report.py

      # ── ECR cleanup ───────────────────────────────────────────
      - name: Run ECR image cleanup
        run: |
          echo "Running ECR image cleanup policy..."
          custodian run \
            --output-dir finops/reports/custodian/ecr \
            governance/custodian/ecr-image-cleanup.yaml

          echo "=== ECR cleanup results ==="
          cat finops/reports/custodian/ecr/ecr-old-image-cleanup/resources.json \
            2>/dev/null || echo "No resources affected"
        continue-on-error: true

      # ── EBS cleanup ───────────────────────────────────────────
      - name: Run EBS volume cleanup
        run: |
          echo "Running EBS unattached volume cleanup..."
          custodian run \
            --output-dir finops/reports/custodian/ebs \
            governance/custodian/ebs-cleanup.yaml

          echo "=== EBS cleanup results ==="
          cat finops/reports/custodian/ebs/unused-ebs-cleanup/resources.json \
            2>/dev/null || echo "No resources affected"
        continue-on-error: true

      # ── NLB cleanup ───────────────────────────────────────────
      - name: Run unused NLB cleanup
        run: |
          echo "Running unused NLB cleanup..."
          custodian run \
            --output-dir finops/reports/custodian/nlb \
            governance/custodian/unused-nlb.yaml

          echo "=== NLB cleanup results ==="
          cat finops/reports/custodian/nlb/unused-nlb-cleanup/resources.json \
            2>/dev/null || echo "No resources affected"
        continue-on-error: true

      # ── Upload artifacts ──────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finops-reports
          path: |
            cost-report.json
            finops/reports/monthly.md
            finops/reports/custodian/

      # ── Commit everything ─────────────────────────────────────
      - name: Commit reports to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            finops/reports/monthly.md \
            cost-report.json \
            finops/reports/custodian/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            MONTH=$(date +"%B %Y")
            git commit -m "chore(finops): auto-update FinOps report for $MONTH [skip ci]"
            git push origin main
          fi