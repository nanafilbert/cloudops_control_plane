name: "RDS Off-Hours Schedule"

on:
  schedule:
    - cron: '0 22 * * *'   # Stop: 10pm UTC every day
    - cron: '0 8 * * *'    # Start: 8am UTC every day
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - stop
          - start

permissions:
  id-token: write
  contents: read

jobs:
  rds-schedule:
    runs-on: ubuntu-latest
    env:
      DB_IDENTIFIER: cloudops-dev-postgres-db
      REGION: us-east-1

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Determine action from schedule
        id: action
        run: |
          HOUR=$(date -u +%H)
          echo "Current UTC hour: $HOUR"
          echo "Event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
          elif [ "$HOUR" = "22" ] || [ "$HOUR" = "23" ]; then
            ACTION="stop"
          elif [ "$HOUR" = "08" ] || [ "$HOUR" = "09" ]; then
            ACTION="start"
          else
            ACTION="none"
            echo "No action needed at hour $HOUR"
          fi

          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "Determined action: $ACTION"

      - name: Check RDS current status
        id: status
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.DB_IDENTIFIER }} \
            --region ${{ env.REGION }} \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text 2>/dev/null || echo "not-found")
          echo "Current RDS status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Stop RDS
        if: steps.action.outputs.action == 'stop' && steps.status.outputs.status == 'available'
        run: |
          echo "Stopping RDS instance ${{ env.DB_IDENTIFIER }}"
          aws rds stop-db-instance \
            --db-instance-identifier ${{ env.DB_IDENTIFIER }} \
            --region ${{ env.REGION }}
          echo "✅ RDS stop initiated — will be stopped within a few minutes"

      - name: Start RDS
        if: steps.action.outputs.action == 'start' && steps.status.outputs.status == 'stopped'
        run: |
          echo "Starting RDS instance ${{ env.DB_IDENTIFIER }}"
          aws rds start-db-instance \
            --db-instance-identifier ${{ env.DB_IDENTIFIER }} \
            --region ${{ env.REGION }}
          echo "✅ RDS start initiated — will be available within a few minutes"

      - name: No action needed
        if: |
          steps.action.outputs.action == 'none' ||
          (steps.action.outputs.action == 'stop' && steps.status.outputs.status != 'available') ||
          (steps.action.outputs.action == 'start' && steps.status.outputs.status != 'stopped')
        run: |
          echo "ℹ️ No action taken"
          echo "  Action determined: ${{ steps.action.outputs.action }}"
          echo "  RDS current status: ${{ steps.status.outputs.status }}"