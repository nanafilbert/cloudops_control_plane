name: "Docker Build & Push"

on:
  workflow_run:
    workflows: ["Terraform Apply"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      game_service_changed: ${{ steps.filter.outputs.game_service }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          submodules: recursive

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            game_service:
              - 'services/game-service/**'
              - '.github/workflows/docker-build.yml'
            

  build-and-push:
    name: Build & Push Game Service
    runs-on: ubuntu-latest
    needs: changes

    if: |
      github.event.workflow_run.conclusion == 'success' &&
      needs.changes.outputs.game_service_changed == 'true'

    env:
      AWS_REGION: us-east-1
      IMAGE_NAME: cloudops-dev-game-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)

          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV

      - name: Build and Push ARM64 Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/game-service
          platforms: linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_URI }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE_URI }}:latest

          cache-from: |
            type=registry,ref=${{ env.IMAGE_URI }}:buildcache

          cache-to: |
            type=registry,ref=${{ env.IMAGE_URI }}:buildcache,mode=max

          provenance: false
          sbom: false

      - name: Image Summary
        run: |
          echo "Image pushed successfully:"
          echo "${IMAGE_URI}:${IMAGE_TAG}"
          echo "${IMAGE_URI}:${SHORT_SHA}"
          echo "${IMAGE_URI}:latest"

