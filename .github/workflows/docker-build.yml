name: "Docker Build & Push"

on:
  workflow_run:
    workflows: ["Terraform Apply"]
    types:
      - completed

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Check whether a build is needed ────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}

    env:
      AWS_REGION: us-east-1
      IMAGE_NAME: cloudops-dev-game-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          submodules: recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            game_service:
              - 'services/game-service/**'
              - '.github/workflows/03-docker-build.yml'

      - name: Check if image exists in ECR
        id: ecr_check
        run: |
          if aws ecr describe-images \
            --repository-name ${{ env.IMAGE_NAME }} \
            --image-ids imageTag=latest \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "image_exists=true" >> $GITHUB_OUTPUT
          else
            echo "image_exists=false" >> $GITHUB_OUTPUT
            echo "ECR has no image — fresh environment detected, build required"
          fi

      - name: Decide whether to build
        id: decide
        run: |
          CODE_CHANGED="${{ steps.filter.outputs.game_service }}"
          IMAGE_EXISTS="${{ steps.ecr_check.outputs.image_exists }}"

          if [ "$IMAGE_EXISTS" = "false" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Reason: ECR empty (fresh environment)"
          elif [ "$CODE_CHANGED" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Reason: game-service code changed"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Reason: image exists and no code changes — skipping build"
          fi

  # ── Build, scan, and push ───────────────────────────────────────────────────
  build-and-push:
    name: Build, Scan & Push Game Service
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_build == 'true'

    env:
      AWS_REGION: us-east-1
      IMAGE_NAME: cloudops-dev-game-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV

      # ── Build locally for Trivy scan (no push yet) ──────────────────────────
      - name: Build image for scanning (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./services/game-service
          platforms: linux/arm64
          push: false
          load: true
          tags: game-service:scan-target
          cache-from: type=registry,ref=${{ env.IMAGE_URI }}:buildcache
          provenance: false
          sbom: false

      # ── Trivy scan: print findings table to logs ────────────────────────────
      - name: Scan image with Trivy (show findings in logs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: game-service:scan-target
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          pkg-types: os,library
          timeout: 10m
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_SKIP_VERSION_CHECK: "true"

      # ── Trivy scan: SARIF upload to GitHub Security (blocks push on fail) ───
      - name: Scan image with Trivy (SARIF gateway)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: game-service:scan-target
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: os,library
          timeout: 10m
          skip-dirs: /usr/share/doc
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
          TRIVY_SKIP_VERSION_CHECK: "true"

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      # ── Push only if scan passed ────────────────────────────────────────────
      - name: Build and Push ARM64 image (scan passed)
        uses: docker/build-push-action@v6
        with:
          context: ./services/game-service
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_URI }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE_URI }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_URI }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_URI }}:buildcache,mode=max
          provenance: false
          sbom: false

      - name: Image summary
        run: |
          echo "✅ Trivy scan passed — image pushed:"
          echo "  ${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}"
          echo "  ${{ env.IMAGE_URI }}:${{ env.SHORT_SHA }}"
          echo "  ${{ env.IMAGE_URI }}:latest"