name: "Terraform Plan & Test"

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'terraform/modules/**'
      - 'terraform/environments/**'
      - 'services/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test-game-service:
    name: "Test Django Game Service"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/game-service/requirements.txt

      - name: Install dependencies
        run: pip install -r services/game-service/requirements.txt

      - name: Run Django tests
        run: |
          cd services/game-service
          python manage.py test

  terraform-plan:
    name: "Terraform Plan & Security Scan"
    runs-on: ubuntu-latest
    needs: test-game-service
    env:
      TF_WORKING_DIR: 'terraform/environments/dev'
      TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_github_oidc_role_arn: ${{ secrets.GH_OIDC_ROLE_ARN }}
      TF_VAR_admin_iam_principal_arn: ${{ secrets.ADMIN_IAM_PRINCIPAL_ARN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/modules
          config_file: governance/checkov/checkov.yaml
          framework: terraform
          soft_fail: true

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Infracost baseline (base branch)
        if: github.event_name == 'pull_request'
        run: |
          # Run on PR branch first (already checked out)
          infracost breakdown \
            --path ${{ env.TF_WORKING_DIR }} \
            --format json \
            --out-file /tmp/infracost-pr.json || true

          # Switch to base branch for comparison
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}

          infracost breakdown \
            --path ${{ env.TF_WORKING_DIR }} \
            --format json \
            --out-file /tmp/infracost-base.json || true

          # Return to PR commit using SHA
          git checkout ${{ github.event.pull_request.head.sha }}

      - name: Infracost diff (PR branch)
        if: github.event_name == 'pull_request'
        run: |
          infracost diff \
            --path ${{ env.TF_WORKING_DIR }} \
            --format json \
            --compare-to /tmp/infracost-base.json \
            --out-file /tmp/infracost-diff.json || true

      - name: Post Infracost comment on PR
        if: github.event_name == 'pull_request'
        run: |
          infracost comment github \
            --path /tmp/infracost-diff.json \
            --repo ${{ github.repository }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --behavior update

      - name: Infracost breakdown (push to main)
        if: github.event_name == 'push'
        run: |
          infracost breakdown \
            --path ${{ env.TF_WORKING_DIR }} \
            --format table || true

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan

      - name: Convert Plan to Text
        run: terraform show -no-color tfplan > tfplan.txt
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Post Infracost comment on PR
        if: github.event_name == 'pull_request'
        run: |
   
          infracost breakdown \
            --path ${{ env.TF_WORKING_DIR }} \
            --format json \
            --out-file /tmp/infracost-total.json || true

    
          infracost comment github \
            --path /tmp/infracost-diff.json \
            --repo ${{ github.repository }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --behavior update

    
          echo "=== Current monthly estimate ==="
          infracost output \
            --path /tmp/infracost-total.json \
            --format table
