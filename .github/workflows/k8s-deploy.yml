name: "Kubernetes Deploy"

on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      ENV: dev
      CLUSTER_NAME: cloudops-dev-eks-cluster
      REGION: us-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.REGION }}

      - name: Resolve image tag
        run: |
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV

      - name: Install External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ secrets.ESO_IRSA_ROLE_ARN }} \
            --wait \
            --timeout 3m

      - name: Apply ClusterSecretStore
        run: |
          kubectl wait --for=condition=established \
            crd/clustersecretstores.external-secrets.io \
            crd/externalsecrets.external-secrets.io \
            --timeout=60s

          sleep 15
          rm -rf ~/.kube/cache/discovery/

          for i in {1..5}; do
            kubectl apply -f kubernetes/base/cluster-secret-store.yaml && \
            echo "ClusterSecretStore applied" && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
            if [ $i -eq 5 ]; then
              echo "Failed after 5 attempts"
              exit 1
            fi
          done

      - name: Apply Kustomize overlays
        run: |
          kubectl apply -k kubernetes/overlays/${{ env.ENV }}

      - name: Wait for secrets to sync
        run: |
          kubectl wait externalsecret/game-redis-credentials \
            --for=condition=Ready \
            --namespace game-dev \
            --timeout=60s || true

      - name: Install metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system \
            --set args[0]="--kubelet-insecure-tls" \
            --wait \
            --timeout 2m

      - name: Install AWS Load Balancer Controller
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=${{ env.CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set replicaCount=1 \
            --set region=${{ env.REGION }} \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ secrets.LBC_IRSA_ROLE_ARN }} \
            --set vpcId=$(aws eks describe-cluster \
              --name ${{ env.CLUSTER_NAME }} \
              --region us-east-1 \
              --query 'cluster.resourcesVpcConfig.vpcId' \
              --output text) \
            --wait \
            --timeout 3m

      - name: Clean up stuck ingress-nginx admission jobs
        run: |
          kubectl delete jobs --all -n ingress-nginx 2>/dev/null || true
          kubectl delete pods --field-selector=status.phase=Pending \
            -n ingress-nginx 2>/dev/null || true
          helm status ingress-nginx -n ingress-nginx 2>/dev/null | grep -q "failed" && \
           helm uninstall ingress-nginx -n ingress-nginx 2>/dev/null || true
          sleep 10
        continue-on-error: true

      - name: Install ingress-nginx
        run: |
           helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
           helm repo update

           helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
             --namespace ingress-nginx \
             --create-namespace \
             --set controller.service.type=LoadBalancer \
             --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-type"=nlb \
             --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-scheme"=internet-facing \
             --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-name"=cloudops-dev-nlb \
             --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-ssl-cert"=${{ secrets.ACM_CERT_ARN }} \
             --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-listen-ports"="[{\"HTTPS\":443}]" \
             --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-backend-protocol"=http \
             --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-nlb-target-type"=instance \
             --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-cross-zone-load-balancing-enabled"=true \
             --set controller.service.targetPorts.https=http \
             --set controller.config.use-forwarded-headers=true \
             --set controller.config.hsts=true \
             --set controller.config.hsts-max-age=31536000 \
             --set controller.config.hsts-include-subdomains=true \
             --set controller.ingressClassResource.enabled=true \
             --set controller.ingressClassResource.default=true \
             --set controller.ingressClassResource.name=nginx \
             --set controller.ingressClassResource.controllerValue="k8s.io/ingress-nginx" \
             --set controller.config.proxy-read-timeout=3600 \
             --set controller.config.proxy-send-timeout=3600 \
             --set controller.resources.requests.memory=128Mi \
             --set controller.resources.limits.memory=256Mi \
             --set replicaCount=1 \
             --timeout 8m

      - name: Wait for ingress-nginx NLB
        run: |
          echo "Waiting for ingress-nginx controller to be ready..."
          kubectl rollout status deployment/ingress-nginx-controller \
            -n ingress-nginx \
            --timeout=5m

          echo "Waiting for NLB to get an external IP..."
          for i in {1..20}; do
           EXTERNAL_IP=$(kubectl get svc ingress-nginx-controller \
             -n ingress-nginx \
             -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
           if [ -n "$EXTERNAL_IP" ]; then
             echo "NLB ready: $EXTERNAL_IP"
             break
           fi
           echo "Attempt $i — waiting 15s..."
           sleep 15
          done

      - name: Deploy game-service
        run: |
          helm upgrade --install game-service ./helm/game-service \
            --namespace game-dev \
            --create-namespace \
            --values configs/dev/values-game-service.yaml \
            --set image.repository=234506497205.dkr.ecr.us-east-1.amazonaws.com/cloudops-dev-game-service \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --atomic \
            --timeout 5m \
            --cleanup-on-fail

      - name: Deploy monitoring stack (Prometheus + Grafana)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --values kubernetes/monitoring/prometheus-values.yaml \
            --timeout 10m \
            --cleanup-on-fail
            # no --atomic — keeps pods alive if timeout so we can inspect

          kubectl apply -f kubernetes/monitoring/grafana-dashboard-game.yaml || true
          kubectl apply -f kubernetes/monitoring/prometheus-alerts.yaml || true

      - name: Deploy Loki (log aggregation)
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

          helm uninstall loki -n logging 2>/dev/null || true

          helm upgrade --install loki grafana/loki \
            --namespace logging \
            --create-namespace \
            --values kubernetes/monitoring/loki-values.yaml \
            --timeout 5m \
            --cleanup-on-fail || true   # non-fatal

      - name: Deploy Promtail (log shipping)
        run: |
          helm upgrade --install promtail grafana/promtail \
            --namespace logging \
            --create-namespace \
            --set "config.clients[0].url=http://loki.logging.svc.cluster.local:3100/loki/api/v1/push" \
            --set resources.requests.memory=32Mi \
            --set resources.requests.cpu=10m \
            --set resources.limits.memory=64Mi \
            --set resources.limits.cpu=50m \
            --timeout 3m \
            --cleanup-on-fail || true   # non-fatal

      - name: Health check
        run: |
          kubectl wait pod \
            --for=condition=Ready \
            --selector=app=game-service \
            --namespace game-dev \
            --timeout=120s

      - name: Debug pod status
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo "=== game-dev events ==="
          kubectl get events -n game-dev --sort-by='.lastTimestamp'
          echo "=== ExternalSecret ==="
          kubectl describe externalsecret -n game-dev
          echo "=== game-service pod logs ==="
          kubectl logs -l app=game-service -n game-dev --tail=50 || true
          echo "=== monitoring events ==="
          kubectl get events -n monitoring --sort-by='.lastTimestamp' | tail -20 || true
          echo "=== prometheus logs ==="
          kubectl logs prometheus-monitoring-kube-prometheus-prometheus-0 \
            -n monitoring -c prometheus --tail=50 || true
          echo "=== loki logs ==="
          kubectl logs -n logging -l app.kubernetes.io/name=loki --tail=50 || true