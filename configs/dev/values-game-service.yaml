# Overrides for game-service Helm chart (dev environment)

replicaCount: 1

image:
  repository: 234506497205.dkr.ecr.us-east-1.amazonaws.com/cloudops-dev-game-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

livenessProbe:
  tcpSocket:
    port: 8000
  initialDelaySeconds: 40
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: 8000
  initialDelaySeconds: 30
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 3

ingress:
  enabled: false
  host: game.dev.yourdomain.com
  path: /
  pathType: Prefix

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "200m"

env:
  - name: DJANGO_ALLOWED_HOSTS
    value: "therealblessing.com,www.therealblessing.com"

  - name: DB_SECRET_NAME
    value: "cloudops-dev-postgres-secret"
  - name: DB_REGION
    value: "us-east-1"
  - name: LOG_LEVEL
    value: "debug"
  
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: game-redis-credentials
        key: REDIS_URL

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Network policy (zero trust) – enabled by default
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egressTo:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0  # restrict to RDS CIDR in production
          ports:
            - port: 5432
              protocol: TCP
            - port: 6379
              protocol: TCP