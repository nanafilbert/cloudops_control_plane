apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-redis-credentials
  namespace: game-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: game-redis-credentials
    creationPolicy: Owner
    template:
      data:
        REDIS_URL: "rediss://:{{ .password }}@{{ .host }}:6379"
  data:
    - secretKey: host
      remoteRef:
        key: cloudops-dev-redis-secret
        property: host
    - secretKey: password
      remoteRef:
        key: cloudops-dev-redis-secret
        property: password