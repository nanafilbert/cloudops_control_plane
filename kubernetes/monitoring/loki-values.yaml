# kubernetes/monitoring/loki-values.yaml

# 1. Target the monolithic single-container execution model
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
  
  # Turn off persistent block device (EBS) dynamic allocations
  persistence:
    enabled: false

  # 2. Inject writable memory spaces to fix the 'read-only file system' block
  extraVolumes:
    - name: storage
      emptyDir: {}
  extraVolumeMounts:
    - name: storage
      mountPath: /var/loki

# 3. Explicitly zero-out the distributed chart defaults to bypass validation loops
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# 4. Strip down ancillary microservices to conserve pod slots
gateway:
  enabled: false
loki-canary:
   enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

test:
  enabled: false